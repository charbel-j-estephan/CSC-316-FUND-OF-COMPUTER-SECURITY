  <script language="javascript">
    function MM_preloadImages() {
      var d = document;
      if (d.images) {
        if (!d.MM_p) d.MM_p = new Array();
        var i, j = d.MM_p.length,
          a = MM_preloadImages.arguments;
        for (i = 0; i < a.length; i++)
          if (a[i].indexOf("#") != 0) {
            d.MM_p[j] = new Image;
            d.MM_p[j++].src = a[i];
          }
      }
    }
    function MM_swapImgRestore() {
      var i, x, a = document.MM_sr;
      for (i = 0; a && i < a.length && (x = a[i]) && x.oSrc; i++) x.src = x.oSrc;
    }
    function MM_findObj(n, d) {
      var p, i, x;
      if (!d) d = document;
      if ((p = n.indexOf("?")) > 0 && parent.frames.length) {
        d = parent.frames[n.substring(p + 1)].document;
        n = n.substring(0, p);
      }
      if (!(x = d[n]) && d.all) x = d.all[n];
      for (i = 0; !x && i < d.forms.length; i++) x = d.forms[i][n];
      for (i = 0; !x && d.layers && i < d.layers.length; i++) x = MM_findObj(n, d.layers[i].document);
      if (!x && d.getElementById) x = d.getElementById(n);
      return x;
    }
    function MM_swapImage() {
      var i, j = 0,
        x, a = MM_swapImage.arguments;
      document.MM_sr = new Array();
      for (i = 0; i < (a.length - 2); i += 3)
        if ((x = MM_findObj(a[i])) != null) {
          document.MM_sr[j++] = x; if (!x.oSrc) x.oSrc = x.src;
          x.src = a[i + 2];
        }
    }
  </script>

  <script type="text/javascript">
    function toHex(bytes) {
      return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    function toBase64(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    async function sha256(message) {
      const encoder = new TextEncoder();
      const data = encoder.encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return new Uint8Array(hashBuffer);
    }

    async function handleLogin() {
      const username = document.form1.txtusername.value;
      const password = document.form1.txtpassword.value;

      const saltSeed = username.slice(-4);
      const seedHash = await sha256(saltSeed);
      const saltBytes = seedHash.slice(0, 16); // 16 bytes
      const saltBase64 = toBase64(saltBytes);
      const saltHex = toHex(saltBytes);

      const saltedString = password + saltBase64;

      const finalHashBytes = await sha256(saltedString);
      const finalHashHex = toHex(finalHashBytes);

      // 5. Display results in a new page
      const htmlContent = `
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>Login Details (SHA‑256 + Salt)</title>
            <style>
                body { font-family: Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); max-width: 700px; width: 100%; }
                h2 { text-align: center; color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
                table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                td { padding: 12px; border-bottom: 1px solid #ddd; }
                td:first-child { font-weight: bold; width: 35%; background-color: #f9f9f9; }
                td:last-child { word-break: break-all; font-family: monospace; }
                .note { margin-top: 20px; font-size: 0.9em; color: #555; text-align: center; }
                .hash { background-color: #fff3cd; padding: 4px 8px; border-radius: 4px; }
                .salt { background-color: #e7f3fe; }
            </style>
        </head>
        <body>
            <div class="container">
                <h2>Login Details</h2>
                <table>
                    <tr><td>Username (Student ID)</td><td>${username}</td></tr>
                    <tr><td>Password (plain)</td><td>${password}</td></tr>
                    <tr><td>Seed (last 4 digits)</td><td>${saltSeed}</td></tr>
                    <tr><td>Derived Salt (16 bytes, Base64)</td><td class="salt">${saltBase64}</td></tr>
                    <tr><td>Salted string (password + Base64 salt)</td><td>${saltedString}</td></tr>
                    <tr><td>SHA‑256 Hash (hex)</td><td class="hash">${finalHashHex}</td></tr>
                </table>

            </div>
        </body>
        </html>
        `;

      const newWin = window.open('', '_blank', 'width=750,height=550,scrollbars=yes,resizable=yes');
      if (newWin) {
        newWin.document.write(htmlContent);
        newWin.document.close();
      } else {
        alert('Please allow popups for this site to see the result.\n\nHash: ' + finalHashHex);
      }

      /*console.log('Form submitted!');
      console.log('Username (Student ID):', username);
      console.log('password stored regularly: ', password);
      console.log('password stored after hash (SHA 256)', finalHashHex);
      console.log('Derived salt (last 4 digits as seed):', saltSeed);
      console.log('password stored after salting :', saltedString);*/
    }

    window.go_to = function (pro_no, sis, std) {
      if (pro_no === 1) {
        handleLogin();
        return false;
        document.form1.txtusername.value = '';
        document.form1.txtpassword.value = '';
        document.form1.txtusername.focus();
        return false;
      }
    };

    document.form1.onkeydown = null;

    document.form1.addEventListener('submit', function (e) {
      e.preventDefault();
      return false;
    }, true);

    window.form1_onsubmit = function () { return false; };

    window.onload = function () {
      document.form1.txtusername.focus();
    };
  </script>
